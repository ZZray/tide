[package]
name = "tide-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tide desktop and CLI for Git-powered document synchronization"
rust-version.workspace = true
build = "build.rs"

[features]
default = ["desktop"]
desktop = ["dep:slint", "dep:slint-build", "dep:tray-icon", "dep:rfd", "dep:single-instance", "dep:auto-launch", "dep:open", "dep:notify-rust", "dep:image"]

[[bin]]
name = "tide"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
tide-core = { path = "../tide-core" }
tide-git = { path = "../tide-git" }
chrono.workspace = true
directories.workspace = true
semver = "1"
sha2 = "0.10"
tempfile.workspace = true
uuid.workspace = true
slint = { version = "=1.16.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"], optional = true }
tray-icon = { version = "0.21", optional = true }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"], optional = true }
single-instance = { version = "0.3", optional = true }
auto-launch = { version = "0.5", optional = true }
open = { version = "5", optional = true }
notify-rust = { version = "4", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }
# Self-update over HTTPS: Windows certificate store (schannel) and environment/system proxy.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default", "win-system-proxy"] }

[build-dependencies]
slint-build = { version = "=1.16.1", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
git2.workspace = true
i-slint-backend-testing = "=1.16.1"
