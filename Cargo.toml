[workspace]
members = ["crates/tide-git", "crates/tide-core", "crates/tide-app"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/ZZray/tide"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
git2 = { version = "0.21", features = ["vendored-libgit2", "https", "ssh"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
