name: Windows packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Keep Rust caches in the runner temporary/workspace volume
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/cargo-home" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE/target" >> $env:GITHUB_ENV
          "CARGO_BUILD_BUILD_DIR=$env:RUNNER_TEMP/cargo-build" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # Reuse the Windows CI job's dependency cache.
          shared-key: test
          cache-directories: ${{ runner.temp }}/cargo-build
          cache-on-failure: true
      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw),'(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match workspace version.' }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -- --skip thousand_alternating_rounds_preserve_versions
      - run: cargo build --release --workspace --locked
      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE) { throw 'Inno Setup installation failed.' }
          }
      - name: Package installer, portable archive and licenses
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Verify install, installed executable and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/dist/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          ./scripts/test-windows-package.ps1 -Installer $installers[0].FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Tide-windows-x64
          path: |
            target/dist/*-setup.exe
            target/dist/*-portable.zip
            target/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish preview release from verified cloud build
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem target/dist/*-setup.exe,target/dist/*-portable.zip,target/dist/SHA256SUMS.txt | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @files --verify-tag --prerelease --title "Tide $env:RELEASE_TAG Preview" --notes-file "docs/releases/$($env:RELEASE_TAG).md"
          if ($LASTEXITCODE) { throw 'GitHub release creation failed.' }
